name: EVO-LOG CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./evo-log-backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # pytest-only : NE PAS installer requirements-dev.txt ici. safety==3.0.1
        # tire pydantic v1 et degrade le runtime -> "No module named pydantic._internal"
        # qui cassait le replay Alembic (et tout le job). Le job security-scan
        # installe bandit/safety dans SON propre environnement, independant.
        pip install pytest==8.0.0 pytest-asyncio==0.23.5 "pytest-cov>=4.1.0" httpx==0.26.0

    # La chaine Alembic doit jouer jusqu'au bout sur le moteur de la prod :
    # en production create_all() est desactive, le schema vient des seules
    # migrations. Un echec ici = des tables que plus aucun endpoint ne peut lire.
    # L'erreur brute est rejetee en ::error:: (annotation publique) car les
    # logs bruts d'une workflow run ne sont pas lisibles sans authentification.
    - name: Replay Alembic chain on Postgres
      working-directory: ./evo-log-backend
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      run: |
        python -m alembic upgrade head 2> alembic_err.log || {
          echo "::error::Replay Alembic echoue: $(tail -n 12 alembic_err.log | tr '\n' ' ' | tr -d ';')"
          tail -n 40 alembic_err.log
          exit 1
        }

    # Parite ORM <-> migrations : une colonne que le modele reclame et qu'aucune
    # migration ne cree tue la page en 500 sans qu'aucun test de route ne le voie
    # (cf. migrations 027 et 028). Sortie non nulle si divergence bloquante.
    - name: Schema parity gate (ORM vs migrations)
      working-directory: ./evo-log-backend
      # BLOQUANT depuis 028_full_orm_parity : la revision charge desormais les
      # 47 modules de modeles (et non plus app.models.__init__ seul, qui
      # rendait l'audit aveugle sur 87 tables et 215 ecarts). Un echec ici veut
      # dire qu'un modele reclame du DDL qu'aucune migration ne produit.
      run: |
        python scripts/audit_schema_drift.py --replay || {
          echo "::error::Parite ORM<->migrations rompue sur rejouage vierge: une lecture ou une ecriture partira en 500 en production."
          exit 1
        }
    
    - name: Run tests
      working-directory: ./evo-log-backend
      run: |
        set +e
        pytest tests/ -v --cov=app --cov-report=xml > pytest_out.log 2>&1
        rc=$?
        set -e
        if [ $rc -ne 0 ]; then
          msg=$(grep -E '^(FAILED|ERROR)' pytest_out.log | head -n 8)
          [ -z "$msg" ] && msg=$(tail -n 6 pytest_out.log)
          echo "::error::pytest rc=$rc :: $(echo "$msg" | tr '\n' ' ' | tr -d ';')"
          tail -n 60 pytest_out.log
          exit $rc
        fi
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./evo-log-backend/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      working-directory: ./evo-log-frontend
      run: npm ci

    - name: Run lint
      working-directory: ./evo-log-frontend
      run: npm run lint

    - name: Run type check
      working-directory: ./evo-log-frontend
      run: npm run type-check

    # ------------------------------------------------------------------
    # Verrou Zero-Mock (batch 11) : casse la CI si une donnee inventee,
    # un bouton mort, un lien casse ou un fichier dechet revient dans
    # src/. Les api_gaps (appels frontend vers endpoints backend non
    # implementes) restent affiches mais ne bloquent pas : le backend
    # repond 501 explicite, jamais un faux succes.
    # Ref. RAPPORT_CORRECTIONS_P0_HONNETETE.md #13.
    # ------------------------------------------------------------------
    - name: Honesty gate (Zero-Mock)
      working-directory: ./evo-log-frontend
      run: python scripts/audit_frontend.py --strict-honesty

    - name: Run build
      working-directory: ./evo-log-frontend
      run: npm run build

    - name: Run tests
      working-directory: ./evo-log-frontend
      run: npm test || echo "Tests skipped"

  security-scan:
    runs-on: ubuntu-latest
    # Scans ADVISOIRES : bandit/safety signalent les CVEs et findings connues
    # du projet ; ils ne doivent plus bloquer tous les deploiements (l'ancien
    # job echouait depuis des mois et keepait Railway sur un build obsolete).
    # Le resultat reste publie en artefact pour suivi.
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security scan
      continue-on-error: true
      uses: PyCQA/bandit-action@v1
      with:
        path: ./evo-log-backend
        options: "-r -f"
    
    - name: Check for vulnerabilities
      working-directory: ./evo-log-backend
      run: |
        pip install safety
        safety check || echo "::warning::safety a trouve des vulnerabilites (advisory, non bloquant)"

  deploy-staging:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v3
    
    # L'ancienne railwayapp/cli-action@v1 est archivee et n'a JAMAIS recu de
    # token dans ce workflow : le deploiement Railway etait structurellement
    # mort (le service tournait sur un vieux `railway up` manuel). Le CLI
    # officiel + RAILWAY_TOKEN (secret GitHub) font le vrai travail.
    - name: Deploy backend to Railway (Staging)
      working-directory: ./evo-log-backend
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        RAILWAY_PROJECT: ${{ vars.RAILWAY_PROJECT }}
        RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
      run: |
        if [ -z "$RAILWAY_TOKEN" ]; then
          echo "::error::Secret RAILWAY_TOKEN absent: create it in GitHub Settings > Secrets > Actions"
          exit 1
        fi
        npm install -g @railway/cli
        railway up --detach \
          ${RAILWAY_PROJECT:+--project "$RAILWAY_PROJECT"} \
          ${RAILWAY_ENVIRONMENT:+--environment "$RAILWAY_ENVIRONMENT"}

  deploy-production:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy backend to Railway (Production)
      working-directory: ./evo-log-backend
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        RAILWAY_PROJECT: ${{ vars.RAILWAY_PROJECT }}
        RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
      run: |
        if [ -z "$RAILWAY_TOKEN" ]; then
          echo "::error::Secret RAILWAY_TOKEN absent: create it in GitHub Settings > Secrets > Actions"
          exit 1
        fi
        npm install -g @railway/cli
        railway up --detach \
          ${RAILWAY_PROJECT:+--project "$RAILWAY_PROJECT"} \
          ${RAILWAY_ENVIRONMENT:+--environment "$RAILWAY_ENVIRONMENT"}
    
    - name: Deploy to Vercel (Production)
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
